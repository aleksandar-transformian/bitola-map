# Ги симнува сировите OSM податоци преку Overpass и ги комитува во data/raw/
# на истата гранка. Се пушта рачно или кога ќе се смени опфатот / скриптата.
name: Податоци — OSM

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - src/config/region.js
      - scripts/data/fetch-osm.mjs
      - .github/workflows/data-fetch.yml

permissions:
  contents: write

concurrency:
  group: data-fetch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Симни OSM (Overpass)
        run: node scripts/data/fetch-osm.mjs
      - name: Комитувај ги сировите податоци
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/osm.json.gz data/raw/places-wide.json
          if git diff --cached --quiet; then
            echo "Нема промени."
          else
            git commit -m "data: освежени OSM податоци ($(date -u +%Y-%m-%d))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
